# Build the React SPA and deploy it to Amplify Hosting via a manual deployment.
#
# Manual only (workflow_dispatch). The Amplify app is created by CDK
# (AmplifyStack) with auto-build DISABLED, so the built artifact is uploaded
# here as a zip using the Amplify "manual deploy" flow.
#
# Auth: OIDC role assumption (no long-lived keys).
name: deploy-spa

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment (used to locate the Amplify CFN stack)."
        type: string
        default: dev
      amplifyAppId:
        description: >-
          Amplify App ID. Leave blank to look it up from the CloudFormation
          outputs of stack LlamaPilot-<environment>-Amplify.
        type: string
        default: ""
      branchName:
        description: "Amplify branch to deploy to."
        type: string
        default: main

# Required for OIDC federation with AWS.
permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: ${{ inputs.environment }}
      BRANCH_NAME: ${{ inputs.branchName }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: spa/package-lock.json

      - name: Install dependencies
        working-directory: spa
        run: npm ci

      - name: Build SPA
        # NOTE: the SPA needs VITE_API_BASE_URL (and any Cognito config) at build
        # time. In CDK-managed Amplify these come from branch env vars; for a
        # manual deploy a human must supply them here (e.g. from CFN outputs).
        working-directory: spa
        run: npm run build

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Resolve Amplify App ID
        id: resolve
        # Prefer the explicit input; otherwise read the CDK stack output.
        run: |
          APP_ID="${{ inputs.amplifyAppId }}"
          if [ -z "${APP_ID}" ]; then
            APP_ID="$(aws cloudformation describe-stacks \
              --stack-name "LlamaPilot-${ENVIRONMENT}-Amplify" \
              --query "Stacks[0].Outputs[?OutputKey=='AmplifyAppId'].OutputValue" \
              --output text)"
          fi
          if [ -z "${APP_ID}" ] || [ "${APP_ID}" = "None" ]; then
            echo "Could not resolve Amplify App ID" >&2
            exit 1
          fi
          echo "app_id=${APP_ID}" >> "$GITHUB_OUTPUT"

      - name: Package build output
        working-directory: spa
        run: |
          # Amplify manual deploy expects a zip of the built site (spa/dist).
          cd dist
          zip -r ../spa-dist.zip .

      - name: Deploy to Amplify
        env:
          APP_ID: ${{ steps.resolve.outputs.app_id }}
        run: |
          # Create a manual deployment, then upload the zip to the returned URL.
          # NOTE: a human must confirm the branch exists and auto-build stays off.
          CREATE_JSON="$(aws amplify create-deployment \
            --app-id "${APP_ID}" \
            --branch-name "${BRANCH_NAME}")"

          UPLOAD_URL="$(echo "${CREATE_JSON}" | jq -r '.zipUploadUrl')"
          JOB_ID="$(echo "${CREATE_JSON}" | jq -r '.jobId')"

          # Upload the artifact to the pre-signed URL Amplify handed back.
          curl -sSf -H "Content-Type: application/zip" \
            --upload-file spa/spa-dist.zip \
            "${UPLOAD_URL}"

          # Kick off the deployment job for the uploaded artifact.
          aws amplify start-deployment \
            --app-id "${APP_ID}" \
            --branch-name "${BRANCH_NAME}" \
            --job-id "${JOB_ID}"

          echo "Started Amplify deployment job ${JOB_ID} for ${APP_ID}/${BRANCH_NAME}" \
            >> "$GITHUB_STEP_SUMMARY"
