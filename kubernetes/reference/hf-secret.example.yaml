# =============================================================================
# EXAMPLE ONLY — DO NOT COMMIT A REAL SECRET.
#
# This file documents how the `huggingface-token` Secret is created. It is NOT
# applied by CDK and NOT part of the reference manifests that mirror CDK — the
# Secret is created OUT-OF-BAND from AWS Secrets Manager so the token never lives
# in git, in the container image, or in a CloudFormation template.
#
# The vLLM Deployment reads this Secret via secretKeyRef (key `token`,
# optional: true — see reference/vllm.yaml).
#
# ---------------------------------------------------------------------------
# RECOMMENDED: create it imperatively from Secrets Manager at deploy time.
# The value is piped straight from Secrets Manager into kubectl and never
# written to disk:
#
#   HF_TOKEN="$(aws secretsmanager get-secret-value \
#       --secret-id llama-pilot/huggingface-token \
#       --query SecretString --output text)"
#
#   kubectl create secret generic huggingface-token \
#       --namespace llama-pilot \
#       --from-literal=token="${HF_TOKEN}" \
#       --dry-run=client -o yaml | kubectl apply -f -
#
#   unset HF_TOKEN
#
# ---------------------------------------------------------------------------
# The manifest below is shown ONLY to document the resulting shape. The value is
# deliberately <REDACTED>. NEVER replace <REDACTED> with a real token and commit
# it — a committed HF token is a leaked credential. Prefer the command above.
# =============================================================================
#
# apiVersion: v1
# kind: Secret
# metadata:
#   name: huggingface-token
#   namespace: llama-pilot
# type: Opaque
# stringData:
#   # NEVER commit a real token here. Source it from AWS Secrets Manager instead.
#   token: "<REDACTED>"
